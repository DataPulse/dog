[package]
name = "test-support"
version = "0.0.0"
description = "Test-only helpers for dog: real captured fixtures, wire mutations, loopback mock servers"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
# `alpn-accept` lets the mock TLS server choose HTTP/2, and `alpn` lets its
# tests offer it; on Linux both need nothing beyond the system OpenSSL
native-tls = { version = "0.2", optional = true, features = ["alpn", "alpn-accept"] }
pretty_assertions.workspace = true

[features]
default = []
tls = ["dep:native-tls"]
