// BIND configuration for capturing dog's tier-2 test fixtures.
// Started by tests/capture/capture.py in a throwaway docker container
// listening only on 127.0.0.1; it serves one zone and never recurses.

options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    minimal-responses no;
    edns-udp-size 4096;
    max-udp-size 4096;
    version "dogtest";
    hostname "dogtest";
    server-id none;
};

controls { };

zone "dogtest.example" {
    type primary;
    file "/etc/bind/dogtest.example.zone";
};
